openapi: 3.1.0
components:
  schemas:
    Session:
      type: object
      description: Describes one charging session. Does not require energy transfer.
      required:
      - country_code
      - party_id
      - id
      - start_date_time
      - kwh
      - cdr_token
      - auth_method
      - location_id
      - evse_uid
      - connector_id
      - currency
      - status
      - last_updated
      properties:
        country_code:
          type: string
          maxLength: 2
          description: ISO-3166 alpha-2 country code of the CPO that owns this Session.
          minLength: 2
        party_id:
          type: string
          maxLength: 3
          description: ID of the CPO that owns this Session.
          minLength: 3
        id:
          type: string
          maxLength: 36
          description: Unique ID of the charging session in the CPO platform.
        start_date_time:
          type: string
          format: date-time
        end_date_time:
          type: string
          format: date-time
        kwh:
          type: number
          description: How many kWh were charged.
        cdr_token:
          $ref: ../cdrs/schema.yaml#/components/schemas/CdrToken
        auth_method:
          $ref: ../cdrs/schema.yaml#/components/schemas/AuthMethod
        authorization_reference:
          type: string
          maxLength: 36
          description: Reference to the authorization given by the eMSP.
        location_id:
          type: string
          maxLength: 36
          description: Location.id where the charging session is/was happening.
        evse_uid:
          type: string
          maxLength: 36
          description: EVSE.uid of the EVSE. Can be '#NA' for reservation without assigned EVSE.
        connector_id:
          type: string
          maxLength: 36
          description: Connector.id of the Connector. Can be '#NA' for reservation without assigned connector.
        meter_id:
          type: string
          maxLength: 255
          description: Optional identification of the kWh meter.
        currency:
          type: string
          maxLength: 3
          description: ISO-4217 code of the currency used for this session.
        charging_periods:
          type: array
          items:
            $ref: ../cdrs/schema.yaml#/components/schemas/ChargingPeriod
          description: List of Charging Periods to calculate/verify total cost.
        total_cost:
          $ref: ../../components/schema.yaml#/components/schemas/Price
        status:
          $ref: '#/components/schemas/SessionStatus'
        last_updated:
          type: string
          format: date-time
      additionalProperties: true
    SessionPatch:
      type: object
      description: Partial Session object for PATCH. MUST contain last_updated.
      required:
      - last_updated
      properties:
        end_date_time:
          type: string
          format: date-time
        kwh:
          type: number
        cdr_token:
          $ref: ../cdrs/schema.yaml#/components/schemas/CdrToken
        auth_method:
          $ref: ../cdrs/schema.yaml#/components/schemas/AuthMethod
        authorization_reference:
          type: string
          maxLength: 36
        meter_id:
          type: string
          maxLength: 255
        currency:
          type: string
          maxLength: 3
        charging_periods:
          type: array
          items:
            $ref: ../cdrs/schema.yaml#/components/schemas/ChargingPeriod
        total_cost:
          $ref: ../../components/schema.yaml#/components/schemas/Price
        status:
          $ref: '#/components/schemas/SessionStatus'
        last_updated:
          type: string
          format: date-time
      additionalProperties: true
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - COMPLETED
      - INVALID
      - PENDING
      - RESERVATION
      description: The status of a charging session.
