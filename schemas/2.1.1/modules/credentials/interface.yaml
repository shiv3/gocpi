openapi: 3.1.0
info:
  title: OCPI 2.1.1 Credentials Interface
  description: The Credentials module is used to exchange credentials tokens between parties.
  version: 2.1.1
  contact:
    name: EVRoaming Foundation
    url: https://evroaming.org
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
security:
- ocpiAuthorization: []
components:
  securitySchemes:
    ocpiAuthorization:
      $ref: ../../components/schema.yaml#/components/securitySchemes/ocpiAuthorization
paths:
  /credentials:
    get:
      operationId: getCredentials
      summary: Get credentials
      tags:
      - Credentials
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Request-ID
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Correlation-ID
      responses:
        '200':
          description: Successful response containing the credentials object.
          headers:
            X-Request-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Correlation-ID
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../components/schema.yaml#/components/schemas/OCPIResponse
                - type: object
                  properties:
                    data:
                      $ref: ./schema.yaml#/components/schemas/Credentials
        '400':
          $ref: ../../components/schema.yaml#/components/responses/OCPIErrorResponse
        '401':
          $ref: ../../components/schema.yaml#/components/responses/OCPIUnauthorizedResponse
    post:
      operationId: postCredentials
      summary: Register credentials
      tags:
      - Credentials
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Request-ID
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Correlation-ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schema.yaml#/components/schemas/Credentials
      responses:
        '200':
          description: Successful response containing credentials.
          headers:
            X-Request-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Correlation-ID
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../components/schema.yaml#/components/schemas/OCPIResponse
                - type: object
                  properties:
                    data:
                      $ref: ./schema.yaml#/components/schemas/Credentials
        '400':
          $ref: ../../components/schema.yaml#/components/responses/OCPIErrorResponse
        '401':
          $ref: ../../components/schema.yaml#/components/responses/OCPIUnauthorizedResponse
    put:
      operationId: putCredentials
      summary: Update credentials
      tags:
      - Credentials
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Request-ID
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Correlation-ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schema.yaml#/components/schemas/Credentials
      responses:
        '200':
          description: Successful response containing credentials.
          headers:
            X-Request-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ../../components/schema.yaml#/components/headers/X-Correlation-ID
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../components/schema.yaml#/components/schemas/OCPIResponse
                - type: object
                  properties:
                    data:
                      $ref: ./schema.yaml#/components/schemas/Credentials
        '400':
          $ref: ../../components/schema.yaml#/components/responses/OCPIErrorResponse
        '401':
          $ref: ../../components/schema.yaml#/components/responses/OCPIUnauthorizedResponse
    delete:
      operationId: deleteCredentials
      summary: Unregister credentials
      tags:
      - Credentials
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Request-ID
      - $ref: ../../components/parameters.yaml#/components/parameters/X-Correlation-ID
      responses:
        '200':
          $ref: ../../components/schema.yaml#/components/responses/OCPISuccessResponse
        '400':
          $ref: ../../components/schema.yaml#/components/responses/OCPIErrorResponse
        '401':
          $ref: ../../components/schema.yaml#/components/responses/OCPIUnauthorizedResponse
